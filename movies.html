<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmek</title>
</head>
<body>

  <div class="container">
    <Button id="exitButton" class="btn btn-secondary float-end mt-3">Kijelentkezés</Button>
    <h1 class="text-center">Filmek </h1>


    <div>
      <button id="addButton" class="btn btn-primary mb-3">Hozzáadás</button>
    </div>
    <table class="table table-striped table-success">
      <thead>
        <tr>
          <th>Id</th>
          <th>Cím</th>
          <th>Rendező</th>
          <th>Kiadás éve</th>
        </tr>
      </thead>
      <tbody id="movies-tbody"></tbody>
    </table>
  </div>
  <div id="modalbox"> 
    <div class="modal fade" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Hozzáadás</h5>
            <button type="button" class="btn-close closeButton" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="movieForm">
              <div>
                <label for="title" class="form-label">Cím</label>
                <input type="text" name="title" class="form-control" id="title">
              </div>
              <div>
                <label for="director" class="form-label">Rendező</label>
                <input type="text" name="director" class="form-control" id="director">
              </div>
              <div>
                <label for="releaseYear" class="form-label">Kiadási év</label>
                <input type="text" name="releaseYear" class="form-control" id="releaseYear">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary closeButton" data-bs-dismiss="modal" >Bezárás</button>
            <button type="submit" form="movieForm" class="btn btn-primary">Mentés</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop fade"></div>

  </div>
    
    <script type="module" src="src/movies.js"></script>
</body>
</html>
